name: tests
on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:
    inputs:
      compiler_version:
        description: "Published @lmctl-ai/lmctl version"
        required: false
        default: "0.2.444"
permissions:
  contents: read
concurrency:
  group: tests-${{ github.ref }}
  cancel-in-progress: true
env:
  LMCODE_COMPILER_VERSION: ${{ inputs.compiler_version || vars.LMCODE_COMPILER_VERSION || '0.2.444' }}
jobs:
  build:
    strategy:
      fail-fast: false
      matrix:
        include:
          - {os: ubuntu-24.04, label: linux-x64, rid: linux-x64, ext: ''}
          - {os: ubuntu-24.04-arm, label: linux-arm64, rid: linux-arm64, ext: ''}
          - {os: macos-15, label: macos-arm64, rid: osx-arm64, ext: ''}
          - {os: macos-15-intel, label: macos-x64, rid: osx-x64, ext: ''}
          - {os: windows-2022, label: windows-x64, rid: win-x64, ext: '.exe'}
    runs-on: ${{ matrix.os }}
    defaults:
      run:
        shell: bash
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
        with: {persist-credentials: false}
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020
        with: {node-version: '24'}
      - uses: actions/setup-dotnet@67a3573c9a986a3f9c594539f4ab511d57bb3ce9
        with: {dotnet-version: '8.0.x'}
      - name: Install compiler and native prerequisites
        run: |
          npm install --prefix "$RUNNER_TEMP/lmcode-lmctl" "@lmctl-ai/lmctl@$LMCODE_COMPILER_VERSION"
          echo "$RUNNER_TEMP/lmcode-lmctl/node_modules/.bin" >> "$GITHUB_PATH"
          if [[ "$RUNNER_OS" == Windows ]]; then export LMSCRIPT_BIN="$RUNNER_TEMP/lmcode-lmctl/node_modules/.bin/lmscript.cmd"; else export PATH="$RUNNER_TEMP/lmcode-lmctl/node_modules/.bin:$PATH"; export LMSCRIPT_BIN=lmscript; fi
          echo "LMSCRIPT_BIN=$LMSCRIPT_BIN" >> "$GITHUB_ENV"
          "$LMSCRIPT_BIN" --version
          if [[ "$RUNNER_OS" == Linux ]]; then sudo apt-get update && sudo apt-get install -y clang zlib1g-dev; fi
      - name: Build and test managed and NativeAOT executables
        env:
          RUN_NATIVE: '1'
          RUNTIME_ID: ${{ matrix.rid }}
        run: lmscript --no-preflight test.lms
